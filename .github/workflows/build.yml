name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Descomprimir proyecto
        run: unzip -q ./*.zip

      - name: Compilar APK
        working-directory: WifiKeepAlive
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WifiActiva-apk
          path: WifiKeepAlive/app/build/outputs/apk/debug/app-debug.apk
